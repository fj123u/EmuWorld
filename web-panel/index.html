<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmuWorld | Account Management</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0c;
            --bg-secondary: #121217;
            --text-primary: #ffffff;
            --text-muted: #94a3b8;
            --neon-purple: #a855f7;
            --neon-cyan: #06b6d4;
            --neon-red: #ef4444;
            --border: rgba(255, 255, 255, 0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Ambient Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 20%, rgba(168, 85, 247, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.1) 0%, transparent 40%);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            font-size: 32px;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 24px;
            margin: 0;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin: 8px 0 0;
        }

        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }

        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
        }

        #avatar-preview {
            width: 100%;
            height: 100%;
            border-radius: 28px;
            object-fit: cover;
            border: 3px solid var(--neon-purple);
            background: #1e1e26;
        }

        .avatar-edit {
            position: absolute;
            bottom: -5px;
            right: -5px;
            background: var(--neon-purple);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: var(--transition);
        }

        .avatar-edit:hover {
            transform: scale(1.1);
            filter: brightness(1.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: var(--transition);
        }

        input:focus {
            border-color: var(--neon-purple);
            background: rgba(168, 85, 247, 0.05);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-purple), #7e22ce);
            color: white;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.4);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.1);
            color: var(--neon-red);
            margin-top: 24px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .btn-logout:hover {
            background: var(--neon-red);
            color: white;
        }

        #status-msg {
            text-align: center;
            font-size: 14px;
            margin-top: 16px;
            height: 20px;
        }

        .success {
            color: #10b981;
        }

        .error {
            color: #ef4444;
        }

        #auth-container.hidden {
            display: none;
        }

        #app-container.hidden {
            display: none;
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(168, 85, 247, 0.2);
            border-top-color: var(--neon-purple);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-social:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--text-muted);
            transform: translateY(-2px);
        }

        .btn-social svg {
            width: 18px;
            height: 18px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 24px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <div class="container">
        <!-- Auth View -->
        <div id="auth-container" class="card hidden">
            <div class="header">
                <div class="logo">🎮</div>
                <h1>EmuWorld Web</h1>
                <p class="subtitle">Please sign in to manage your account</p>
            </div>

            <div class="social-grid">
                <button class="btn-social" id="btn-discord">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418z"/></svg>
                    Discord
                </button>
                <button class="btn-social" id="btn-google">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    Google
                </button>
            </div>

            <div class="divider">OR USE EMAIL</div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="auth-email" placeholder="email@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="auth-password" placeholder="••••••••">
            </div>
            <button class="btn btn-primary" id="btn-login">Sign In</button>
            <p id="auth-error" class="error" style="text-align: center; margin-top: 15px; font-size: 14px;"></p>
        </div>

        <!-- App View -->
        <div id="app-container" class="card hidden">
            <div class="header">
                <h1>My Account</h1>
                <p class="subtitle">Update your profile information</p>
            </div>

            <div class="profile-section">
                <div class="avatar-container">
                    <img id="avatar-preview" src="https://ui-avatars.com/api/?name=User&background=1e1e26&color=a855f7"
                        alt="Avatar">
                    <label class="avatar-edit" for="avatar-input">
                        📸
                        <input type="file" id="avatar-input" hidden accept="image/*">
                    </label>
                </div>
                <div id="user-email" style="font-size: 14px; color: var(--text-muted);"></div>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username-input" placeholder="Display Name">
            </div>

            <button class="btn btn-primary" id="btn-save">Save Changes</button>
            <button class="btn btn-logout" id="btn-logout">Logout</button>
            <div id="status-msg"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://yizxrntlerzfniqkdvfg.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlpenhybnRsZXJ6Zm5pcWtkdmZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4OTU1NjcsImV4cCI6MjA5MDQ3MTU2N30.cfZhqeB8IntRnefIS3DirXzwIJ3-u5XZPPXr7g1rO-w";

        const REDIRECT_URL = window.location.origin; // Dynamically use emuworld.alwaysdata.net

        // Initialisation sécurisée
        let supabaseClient;
        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log("Supabase Client initialized successfully.");
        } catch (e) {
            console.error("Failed to initialize Supabase:", e);
        }

        // Elements
        const loading = document.getElementById('loading');
        const authContainer = document.getElementById('auth-container');
        const appContainer = document.getElementById('app-container');
        const statusMsg = document.getElementById('status-msg');

        // --- SEAMLESS LOGIN HANDOFF ---
        async function checkAutoLogin() {
            const hash = window.location.hash.substring(1);
            if (!hash) return;
            
            const params = new URLSearchParams(hash);
            const access_token = params.get('access_token');
            const refresh_token = params.get('refresh_token');

            if (access_token && refresh_token) {
                console.log("Handshake detected! Syncing session...");
                loading.style.display = 'flex';
                
                const { error } = await supabaseClient.auth.setSession({
                    access_token,
                    refresh_token
                });

                if (!error) {
                    window.history.replaceState(null, null, window.location.pathname);
                } else {
                    console.error("Handshake failed:", error.message);
                    loading.style.display = 'none';
                }
            }
        }
        checkAutoLogin();

        // Auth Change Listener
        if (supabaseClient) {
            supabaseClient.auth.onAuthStateChange((event, session) => {
                console.log("Auth event received:", event);
                loading.style.display = 'none';
                if (session) {
                    showApp(session.user);
                } else {
                    showAuth();
                }
            });
        }

        function showAuth() {
            authContainer.classList.remove('hidden');
            appContainer.classList.add('hidden');
        }

        async function showApp(user) {
            authContainer.classList.add('hidden');
            appContainer.classList.remove('hidden');
            document.getElementById('user-email').textContent = user.email;

            // Fetch profile
            try {
                const { data: profile, error } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', user.id)
                    .single();

                if (profile) {
                    document.getElementById('username-input').value = profile.username || "";
                    if (profile.avatar_url) {
                        document.getElementById('avatar-preview').src = `${profile.avatar_url}?t=${new Date().getTime()}`;
                    }
                }
                if (error && error.code !== 'PGRST116') console.error("Profile fetch error:", error);
            } catch (e) {
                console.error("Unexpected error fetching profile:", e);
            }
        }

        // Login Logic
        document.getElementById('btn-login').onclick = async () => {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                document.getElementById('auth-error').textContent = error.message;
            }
        };

        // OAuth Logic
        const signInOAuth = (provider) => {
            supabaseClient.auth.signInWithOAuth({
                provider,
                options: {
                    redirectTo: REDIRECT_URL
                }
            });
        };

        document.getElementById('btn-discord').onclick = () => signInOAuth('discord');
        document.getElementById('btn-google').onclick = () => signInOAuth('google');

        // Save Logic
        document.getElementById('btn-save').onclick = async () => {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) return;

            const username = document.getElementById('username-input').value;
            const { error } = await supabaseClient
                .from('profiles')
                .upsert({
                    id: user.id,
                    username,
                    updated_at: new Date().toISOString()
                });

            if (error) {
                statusMsg.textContent = "Error: " + error.message;
                statusMsg.className = "error";
            } else {
                statusMsg.textContent = "Profile updated! ✨";
                statusMsg.className = "success";
                setTimeout(() => { statusMsg.textContent = ""; }, 3000);
            }
        };

        // Avatar Upload Logic
        document.getElementById('avatar-input').onchange = async (e) => {
            const file = e.target.files[0];
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!file || !user) return;

            statusMsg.textContent = "Uploading... ⏳";
            statusMsg.className = "";

            try {
                const fileExt = file.name.split('.').pop();
                const filePath = `${user.id}-${Math.random()}.${fileExt}`;

                const { error: uploadError } = await supabaseClient.storage
                    .from('avatars')
                    .upload(filePath, file);

                if (uploadError) throw uploadError;

                const { data } = supabaseClient.storage.from('avatars').getPublicUrl(filePath);
                const publicUrl = `${data.publicUrl}?t=${new Date().getTime()}`;

                await supabaseClient.from('profiles')
                    .upsert({
                        id: user.id,
                        avatar_url: data.publicUrl,
                        updated_at: new Date().toISOString()
                    });

                document.getElementById('avatar-preview').src = publicUrl;
                statusMsg.textContent = "Avatar updated! 📸";
                statusMsg.className = "success";
            } catch (err) {
                statusMsg.textContent = "Upload failed: " + err.message;
                statusMsg.className = "error";
            }
        };

        // Logout
        document.getElementById('btn-logout').onclick = () => supabaseClient.auth.signOut();

    </script>
</body>

</html>
