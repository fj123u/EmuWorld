<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EmuWorld</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-0: #08080c;
      --bg-1: #0f0f16;
      --bg-2: #17172160;
      --text: #f4f4ff;
      --muted: #8f8faa;
      --purple: #a855f7;
      --cyan: #22d3ee;
      --amber: #fbbf24;
      --red: #ef4444;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(168, 85, 247, 0.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100vh; }
    body {
      font-family: 'Outfit', -apple-system, system-ui, sans-serif;
      background: var(--bg-0);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed; inset: 0;
      background:
        radial-gradient(circle at 15% 10%, rgba(168, 85, 247, 0.18) 0, transparent 45%),
        radial-gradient(circle at 85% 90%, rgba(34, 211, 238, 0.14) 0, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    a { color: var(--cyan); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .nav {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px;
      background: rgba(8, 8, 12, 0.72);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav__brand {
      font-weight: 800; letter-spacing: 0.5px; font-size: 18px;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .nav__links { display: flex; gap: 18px; align-items: center; }
    .nav__link {
      font-size: 14px; color: var(--muted); transition: color 0.15s;
      cursor: pointer; background: none; border: none; font-family: inherit; padding: 0;
    }
    .nav__link:hover, .nav__link--active { color: var(--text); text-decoration: none; }
    .nav__me {
      display: flex; align-items: center; gap: 10px;
      padding: 4px 10px 4px 4px;
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
    }
    .nav__me img, .nav__me .nav__me-fallback {
      width: 28px; height: 28px; border-radius: 50%; object-fit: cover;
      background: rgba(168, 85, 247, 0.2);
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 600; color: var(--purple);
    }
    .nav__me-name { font-size: 13px; }

    main { position: relative; z-index: 1; padding: 32px 24px 64px; max-width: 1100px; margin: 0 auto; }

    /* ---- Loading / empty ---- */
    .loading {
      text-align: center; padding: 80px 20px; color: var(--muted);
    }
    .loading__spinner {
      width: 44px; height: 44px; margin: 0 auto 16px;
      border: 3px solid rgba(168, 85, 247, 0.2);
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty {
      text-align: center; padding: 64px 24px;
      background: var(--bg-1);
      border: 1px solid var(--border);
      border-radius: 16px;
    }
    .empty__icon { font-size: 48px; margin-bottom: 12px; }
    .empty__title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .empty__text { color: var(--muted); font-size: 14px; }

    /* ---- Profile header ---- */
    .profile-hero {
      display: flex; align-items: center; gap: 20px;
      padding: 26px;
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.12), rgba(34, 211, 238, 0.06));
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      margin-bottom: 24px;
    }
    .profile-hero__avatar {
      width: 88px; height: 88px; border-radius: 22px; object-fit: cover;
      border: 2px solid rgba(168, 85, 247, 0.5);
      background: rgba(168, 85, 247, 0.2);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 32px; color: var(--purple);
      flex-shrink: 0;
    }
    .profile-hero__name { font-size: 28px; font-weight: 800; margin: 0 0 4px; }
    .profile-hero__meta { color: var(--muted); font-size: 14px; }
    .profile-hero__url { margin-top: 8px; font-size: 12px; color: var(--muted); }
    .profile-hero__url code {
      background: rgba(255, 255, 255, 0.04);
      padding: 2px 8px;
      border-radius: 6px;
      font-family: ui-monospace, monospace;
      color: var(--cyan);
    }

    /* ---- KPI tiles ---- */
    .tiles {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px; margin-bottom: 24px;
    }
    .tile {
      padding: 18px;
      background: var(--bg-1);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-align: center;
    }
    .tile__v { font-size: 24px; font-weight: 800; }
    .tile__l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

    /* ---- Stat rows ---- */
    .section {
      background: var(--bg-1);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
    }
    .section__title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; margin: 0 0 14px; }
    .row {
      display: flex; justify-content: space-between; align-items: center;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .row:last-child { border-bottom: none; }
    .row__label { color: var(--muted); font-size: 13px; min-width: 130px; }
    .row__value { flex: 1; min-width: 0; text-align: right; }
    .row__value--with-cover {
      display: flex; align-items: center; justify-content: flex-end; gap: 12px;
    }
    .row__cover {
      width: 40px; height: 56px; object-fit: cover; border-radius: 6px;
      background: rgba(255,255,255,0.05); flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .row__text { min-width: 0; text-align: right; }
    .row__name {
      display: block; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row__meta { font-size: 12px; color: var(--muted); }

    /* ---- Top games list ---- */
    .top-list { list-style: none; padding: 0; margin: 0; }
    .top-list li {
      display: flex; align-items: center; gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .top-list li:last-child { border-bottom: none; }
    .top-list__rank {
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(168, 85, 247, 0.2);
      color: var(--purple);
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px; flex-shrink: 0;
    }
    .top-list__name {
      flex: 1; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .top-list__meta { color: var(--muted); font-size: 12px; }
    .top-list__time { color: var(--text); font-weight: 600; margin-left: 10px; flex-shrink: 0; }

    /* ---- Leaderboard ---- */
    .lb {
      background: var(--bg-1);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .lb__row {
      display: grid; grid-template-columns: 48px 1fr 120px 120px;
      gap: 16px; align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }
    .lb__row:hover { background: rgba(168, 85, 247, 0.06); }
    .lb__row:last-child { border-bottom: none; }
    .lb__row--head {
      background: rgba(255, 255, 255, 0.02);
      cursor: default; color: var(--muted); font-size: 12px;
      text-transform: uppercase; letter-spacing: 0.8px;
    }
    .lb__row--head:hover { background: rgba(255, 255, 255, 0.02); }
    .lb__rank {
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(168, 85, 247, 0.18); color: var(--purple);
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px;
    }
    .lb__rank--1 { background: rgba(251, 191, 36, 0.25); color: var(--amber); }
    .lb__rank--2 { background: rgba(203, 213, 225, 0.18); color: #cbd5e1; }
    .lb__rank--3 { background: rgba(217, 119, 6, 0.18); color: #f59e0b; }
    .lb__user { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .lb__avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: rgba(168,85,247,0.2); }
    .lb__uname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb__num { font-variant-numeric: tabular-nums; }
    .lb__num--muted { color: var(--muted); }

    /* ---- Account modal (reused) ---- */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
      display: none; align-items: center; justify-content: center;
      z-index: 100; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--bg-1);
      border: 1px solid var(--border-strong);
      border-radius: 18px;
      max-width: 440px; width: 100%;
      padding: 24px;
    }
    .modal__title { margin: 0 0 18px; font-size: 22px; font-weight: 700; }
    .modal__field { margin-bottom: 16px; }
    .modal__label { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .modal__input {
      width: 100%; padding: 10px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text); font-family: inherit; font-size: 14px;
    }
    .modal__actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn {
      flex: 1; padding: 10px 14px;
      border: none; border-radius: 10px;
      cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600;
      transition: filter 0.15s;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn--primary { background: linear-gradient(135deg, var(--purple), var(--cyan)); color: white; }
    .btn--danger { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn--ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .status { text-align: center; margin-top: 10px; font-size: 13px; min-height: 18px; }
    .status.ok { color: #22c55e; }
    .status.err { color: var(--red); }

    /* ---- Achievements section ---- */
    .achievements-section { margin-bottom: 20px; }
    .achievements-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .achievements-rank {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px;
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(34, 211, 238, 0.1));
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      font-size: 13px; font-weight: 700;
    }
    .achievements-rank__icon { font-size: 18px; }
    .achievements-rank__label { color: var(--text); }
    .achievements-rank__count { color: var(--muted); font-weight: 400; }
    .achievements-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }
    .ach-card {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px;
      background: var(--bg-1);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: all 0.2s ease;
    }
    .ach-card--locked {
      opacity: 0.4;
      filter: grayscale(0.8);
    }
    .ach-card--hidden {
      opacity: 0.25;
      border-style: dashed;
      filter: grayscale(1) blur(0.3px);
    }
    .ach-card--unlocked {
      border-color: rgba(168, 85, 247, 0.4);
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.06), transparent);
    }
    .ach-card__icon { font-size: 1.6rem; flex-shrink: 0; }
    .ach-card__info { flex: 1; min-width: 0; }
    .ach-card__name { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
    .ach-card__desc { font-size: 11px; color: var(--muted); line-height: 1.3; }
    .ach-card__rarity {
      font-size: 11px; color: var(--cyan); font-weight: 600;
      flex-shrink: 0; text-align: right;
    }
    .ach-card__date { font-size: 10px; color: var(--muted); }

    /* ---- Games tab / grid ---- */
    .profile-tabs {
      display: flex; gap: 4px; margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0;
    }
    .profile-tabs__btn {
      padding: 10px 18px;
      background: none; border: none; border-bottom: 2px solid transparent;
      color: var(--muted); font-family: inherit; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .profile-tabs__btn:hover { color: var(--text); }
    .profile-tabs__btn--active { color: var(--text); border-bottom-color: var(--purple); }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }
    .game-tile {
      position: relative;
      background: var(--bg-1);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
    }
    .game-tile:hover {
      border-color: var(--border-strong);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(168, 85, 247, 0.12);
    }
    .game-tile__cover {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.03);
      display: block;
    }
    .game-tile__placeholder {
      width: 100%;
      aspect-ratio: 3/4;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      font-size: 2rem; color: var(--muted);
    }
    .game-tile__info {
      padding: 10px 12px;
    }
    .game-tile__name {
      font-size: 12px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .game-tile__meta {
      font-size: 11px; color: var(--muted); margin-top: 2px;
      display: flex; align-items: center; gap: 6px;
    }
    .game-tile__100 {
      position: absolute; top: 8px; right: 8px;
      background: rgba(34, 197, 94, 0.9);
      color: white;
      font-size: 10px; font-weight: 800;
      padding: 2px 6px; border-radius: 6px;
    }
    .game-tile__progress {
      height: 3px; background: rgba(255, 255, 255, 0.06);
      border-radius: 99px; margin: 6px 12px 10px;
    }
    .game-tile__progress-fill {
      height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, var(--purple), var(--cyan));
    }

    /* Game detail modal */
    .game-detail {
      background: var(--bg-1);
      border: 1px solid var(--border-strong);
      border-radius: 18px;
      max-width: 540px; width: 100%;
      max-height: 80vh; overflow-y: auto;
      padding: 24px;
    }
    .game-detail__header {
      display: flex; align-items: center; gap: 16px; margin-bottom: 18px;
    }
    .game-detail__cover {
      width: 64px; height: 85px; border-radius: 10px; object-fit: cover;
      border: 1px solid var(--border); flex-shrink: 0;
    }
    .game-detail__title { font-size: 18px; font-weight: 800; margin: 0 0 4px; }
    .game-detail__meta { font-size: 13px; color: var(--muted); }
    .game-detail__stats {
      display: flex; gap: 16px; margin-bottom: 16px;
      font-size: 13px; color: var(--muted);
    }
    .game-detail__stats span { font-weight: 600; color: var(--text); }
    .game-detail__progress {
      height: 8px; background: rgba(255, 255, 255, 0.06);
      border-radius: 99px; margin-bottom: 18px;
    }
    .game-detail__progress-fill {
      height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, var(--purple), var(--cyan));
      transition: width 0.3s;
    }
    .game-detail__ach-list { display: flex; flex-direction: column; gap: 8px; }
    .game-detail__ach {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 10px;
      background: var(--bg-2); border: 1px solid var(--border);
    }
    .game-detail__ach--unlocked {
      border-color: rgba(168, 85, 247, 0.3);
      background: rgba(168, 85, 247, 0.06);
    }
    .game-detail__ach-badge {
      width: 36px; height: 36px; border-radius: 6px; object-fit: cover; flex-shrink: 0;
    }
    .game-detail__ach-badge--locked { filter: grayscale(1) opacity(0.4); }
    .game-detail__ach-name { font-size: 13px; font-weight: 700; }
    .game-detail__ach-desc { font-size: 11px; color: var(--muted); }
    .game-detail__ach-pts {
      margin-left: auto; font-size: 11px; font-weight: 700;
      color: var(--amber); background: rgba(251, 191, 36, 0.15);
      padding: 2px 6px; border-radius: 4px; flex-shrink: 0;
    }
    .game-detail__ach-date { font-size: 10px; color: var(--cyan); margin-top: 1px; }
    .game-detail__close {
      position: absolute; top: 14px; right: 14px;
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: 50%; width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); cursor: pointer; font-size: 18px;
    }
    .game-detail__close:hover { color: var(--text); background: rgba(239, 68, 68, 0.2); }

    .profile-hero__badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 10px;
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 999px;
      font-size: 12px; font-weight: 600;
      margin-left: 10px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <button class="nav__brand nav__link" data-route="home">EmuWorld</button>
    <div class="nav__links">
      <button class="nav__link" data-route="leaderboard">Leaderboard</button>
      <button class="nav__link" id="nav-me-btn" style="display:none;">
        <span class="nav__me">
          <span class="nav__me-fallback" id="nav-me-avatar">U</span>
          <span class="nav__me-name" id="nav-me-name">Me</span>
        </span>
      </button>
      <button class="nav__link" id="nav-login-btn">Sign in</button>
    </div>
  </nav>

  <main id="view"></main>

  <!-- Account modal -->
  <div class="modal-overlay" id="account-modal">
    <div class="modal">
      <h2 class="modal__title">My Account</h2>
      <div class="modal__field">
        <label class="modal__label">Username</label>
        <input class="modal__input" id="account-username" />
      </div>
      <div class="modal__actions">
        <button class="btn btn--primary" id="account-save">Save changes</button>
        <button class="btn btn--ghost" id="account-close">Close</button>
      </div>
      <div class="modal__actions">
        <button class="btn btn--danger" id="account-logout">Sign out</button>
      </div>
      <div class="status" id="account-status"></div>
    </div>
  </div>

  <!-- Login modal -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal">
      <h2 class="modal__title">Sign in</h2>
      <div class="modal__field">
        <label class="modal__label">Email</label>
        <input class="modal__input" id="login-email" type="email" />
      </div>
      <div class="modal__field">
        <label class="modal__label">Password</label>
        <input class="modal__input" id="login-password" type="password" />
      </div>
      <div class="modal__actions">
        <button class="btn btn--primary" id="login-submit">Sign in</button>
        <button class="btn btn--ghost" id="login-close">Close</button>
      </div>
      <div class="status" id="login-status"></div>
    </div>
  </div>

  <script>
    // ============================================================
    // Supabase — same project as the desktop app.
    // ============================================================
    const SUPABASE_URL = 'https://yizxrntlerzfniqkdvfg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlpenhybnRsZXJ6Zm5pcWtkdmZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4OTU1NjcsImV4cCI6MjA5MDQ3MTU2N30.cfZhqeB8IntRnefIS3DirXzwIJ3-u5XZPPXr7g1rO-w';
    // detectSessionInUrl defaults to true and tries to auto-parse the hash — it fights
    // with our manual handoff (no `type` param) and leaves the tokens in the URL. Turn it
    // off so our `consumeTokenHandoff()` is the single source of truth.
    // `lock: () => fn()` bypasses the default Web Locks serialization that
    // Supabase uses to coordinate multiple tabs. On this site there is
    // exactly one Supabase client per tab, and the default lock was racing
    // with itself (setSession + the autoRefreshToken both grab the lock),
    // producing "Lock … was released because another request stole it" on
    // boot. A no-op lock is safe here.
    // Every browse of /u/<pseudo> and /leaderboard is fully anonymous — RLS
    // policies already let anon read public rows. Persisting a session in
    // localStorage brings back the `lock:sb-…-auth-token` race condition on
    // every parallel query, which blanks the page. So we turn off all the
    // stateful auth plumbing and treat the session as transient in-memory
    // only. The "Me" bubble still works via `setSession(…)` on the token
    // handoff, it just doesn't survive a reload (which is fine — the
    // desktop button always re-issues a fresh token).
    // The Web Lock supabase-js uses keys off the storage key. Even with a
    // custom in-memory storage, if another Supabase client on the same
    // origin (e.g. the dev app reloaded in dev mode in the same browser)
    // still writes the default `sb-<ref>-auth-token` key, the lock
    // contention is cross-client and we lose setSession.
    //
    // Fix: give this tab its own unique storageKey + an in-memory storage
    // backend, and override the lock to a no-op. The storageKey makes the
    // lock name unique so nothing else can steal it.
    const memStorage = (() => {
      const m = new Map();
      return {
        getItem: (k) => (m.has(k) ? m.get(k) : null),
        setItem: (k, v) => { m.set(k, String(v)); },
        removeItem: (k) => { m.delete(k); },
      };
    })();
    const noopLock = (_name, _acquireTimeout, fn) => fn();
    // `sb` is anon-only (public reads). When a user arrives via the handoff
    // we build a second authenticated client (`sbAuth`) whose `Authorization`
    // header carries the access token directly — this skips supabase-js's
    // setSession() entirely, which has a habit of hanging on its internal
    // lock / /user round-trip and leaving the page stuck on "boot".
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        detectSessionInUrl: false,
        persistSession: false,
        autoRefreshToken: false,
        storageKey: 'emuworld-web-anon-' + Math.random().toString(36).slice(2),
        storage: memStorage,
        lock: noopLock,
      },
    });
    let sbAuth = null; // authenticated client, created after handoff
    function makeAuthClient(accessToken) {
      return supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: {
          detectSessionInUrl: false,
          persistSession: false,
          autoRefreshToken: false,
          storageKey: 'emuworld-web-auth-' + Math.random().toString(36).slice(2),
          storage: memStorage,
          lock: noopLock,
        },
        global: {
          headers: { Authorization: `Bearer ${accessToken}` },
        },
      });
    }
    function decodeJwt(token) {
      try {
        const payload = token.split('.')[1];
        const json = atob(payload.replace(/-/g, '+').replace(/_/g, '/'));
        return JSON.parse(decodeURIComponent(escape(json)));
      } catch (e) {
        console.error('[EmuWorld] JWT decode failed', e);
        return null;
      }
    }

    const view = document.getElementById('view');

    let currentProfile = null;

    const fmtTime = (seconds) => {
      const s = Math.max(0, Math.floor(seconds || 0));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      if (h > 0) return `${h}h ${m}m`;
      if (m > 0) return `${m}m`;
      return `${sec}s`;
    };
    const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString() : '—';
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const initials = (name) => (name || 'U').trim().slice(0, 2).toUpperCase();

    // Strip scene tags / title IDs / version markers so "Celeste [01002B30028F6000][v0](nsw2u)"
    // renders as "Celeste". Matches what the desktop app shows next to a rom.
    const cleanGameName = (raw) => {
      let s = String(raw || '');
      s = s.replace(/\.(xci|nsp|nca|iso|wbfs|rvz|chd|cue|bin|nes|sfc|smc|gba|gbc|gb|nds|n64|z64|7z|zip|gz|wud|wux|rpx)$/i, '');
      s = s.replace(/\[[^\]]*\]/g, '');   // [01002B30...], [v0]
      s = s.replace(/\([^)]*\)/g, '');    // (nsw2u), (USA), (Rev 1)
      s = s.replace(/\s+/g, ' ').trim();
      // Collapse dots/underscores used as separators in scene releases.
      s = s.replace(/[._]+/g, ' ');
      return s.replace(/\s+/g, ' ').trim();
    };

    // Generate multiple cover URL candidates for fallback
    const coverUrlCandidates = (consoleName, name) => {
      const urls = [];

      if (tidMatch) urls.push(`https://tinfoil.media/ti/${tidMatch[1].toUpperCase()}/256/256`);

      // Check known covers first
      const knownKey = cleaned.toLowerCase();
      if (KNOWN_COVERS[knownKey]) {

        urls.push(`https://thumbnails.libretro.com/${encodeURIComponent(k.sys)}/Named_Boxarts/${encodeURIComponent(k.name)}.png`);
      }

      // Get all candidate systems for this console
      const systems = MULTI_SYSTEMS[consoleName]
        ? MULTI_SYSTEMS[consoleName]

      for (const sys of systems) {
        // Exact cleaned name
        const safe = cleaned.replace(/[&*/:<>?\\|]/g, '_');
        urls.push(`https://thumbnails.libretro.com/${encodeURIComponent(sys)}/Named_Boxarts/${encodeURIComponent(safe)}.png`);

        // Title-cased version
        const titled = toTitleCase(cleaned.toLowerCase());
        if (titled !== cleaned) {
          urls.push(`https://thumbnails.libretro.com/${encodeURIComponent(sys)}/Named_Boxarts/${encodeURIComponent(titled.replace(/[&*/:<>?\\|]/g, '_'))}.png`);
        }

        // With common franchise prefixes
        const lower = cleaned.toLowerCase();
        const PREFIXES = [
          { match: 'zelda', prefix: 'The Legend of Zelda - ' },
          { match: 'pokemon', prefix: 'Pokemon - ' },
          { match: 'mario', prefix: 'Super Mario ' },
        ];
        for (const { match, prefix } of PREFIXES) {
          if (lower.includes(match) && !lower.startsWith(prefix.toLowerCase().trim())) {
            const suffixed = prefix + toTitleCase(lower.replace(match, '').trim());
            urls.push(`https://thumbnails.libretro.com/${encodeURIComponent(sys)}/Named_Boxarts/${encodeURIComponent(suffixed.replace(/[&*/:<>?\\|]/g, '_'))}.png`);
          }
        }

        // With "." after "Bros", "Dr", "Mr", "vs" (libretro convention)
        const withDots = cleaned.replace(/\b(Bros|Dr|Mr|vs|Vol|Jr|St)\b/gi, '$1.');
        if (withDots !== cleaned) {
          urls.push(`https://thumbnails.libretro.com/${encodeURIComponent(sys)}/Named_Boxarts/${encodeURIComponent(withDots.replace(/[&*/:<>?\\|]/g, '_'))}.png`);

      }

      // GameTDB for Wii/Wii U/GameCube (if we can extract a disc ID)
      const discIdMatch = String(name || '').match(/\[([A-Z0-9]{6})\]/);
      if (discIdMatch && (consoleName === 'Wii' || consoleName === 'GameCube / Wii' || consoleName === 'Wii U' || consoleName === 'GameCube')) {

        urls.push(`https://art.gametdb.com/wii/cover/EN/${discIdMatch[1]}.png`);

    // RetroAchievements API helper (client-side)
    const RA_CONSOLE_IDS = {
      'NES': 7, 'Super Nintendo': 3, 'Nintendo 64': 2, 'Game Boy Advance': 5,
      'Game Boy': 4, 'Game Boy Color': 4, 'Nintendo DS': 18, 'Virtual Boy': 28,
      'PlayStation 1': 12, 'PlayStation 2': 21, 'PlayStation Portable': 41,

      'Dreamcast': 40, 'Arcade': 27, 'PC Engine': 8, 'Atari 2600': 25,
    };

    function getRaCredentials() {
      try {
        const stored = localStorage.getItem('emuworld_ra');
        return stored ? JSON.parse(stored) : null;
      } catch { return null; }
    }

    function saveRaCredentials(username, apiKey) {
      localStorage.setItem('emuworld_ra', JSON.stringify({ username, apiKey }));
    }

    async function fetchRaGameProgress(gameName, consoleName) {
      const creds = getRaCredentials();
      if (!creds || !creds.username || !creds.apiKey) return null;

      const consoleId = RA_CONSOLE_IDS[consoleName];
      if (!consoleId) return null;

      // Search for the game
      const cleanRaName = (n) => n.toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
      const cleaned = cleanRaName(cleanGameName(gameName));

      try {
        const listUrl = `https://retroachievements.org/API/API_GetGameList.php?i=${consoleId}&y=${creds.apiKey}&f=1&h=1`;
        const listResp = await fetch(listUrl);
        if (!listResp.ok) return null;
        const gamesList = await listResp.json();

        let gameId = null;
        let bestScore = Infinity;
        for (const g of gamesList) {
          const title = cleanRaName(g.Title || '');
          if (title === cleaned) { gameId = g.ID; break; }
          if (title.includes(cleaned) || cleaned.includes(title)) {
            const score = Math.abs(title.length - cleaned.length);
            if (score < bestScore) { bestScore = score; gameId = g.ID; }
          }
        }
        if (!gameId) return null;

        // Get progress
        const progUrl = `https://retroachievements.org/API/API_GetGameInfoAndUserProgress.php?g=${gameId}&u=${creds.username}&y=${creds.apiKey}`;
        const progResp = await fetch(progUrl);
        if (!progResp.ok) return null;
        return await progResp.json();
      } catch (e) {
        console.error('[RA]', e);
        return null;
      }
    }

    // ============================================================
    // Auth + session handshake (tokens passed via URL hash from the app)
    // ============================================================
    async function consumeTokenHandoff() {
      const hash = window.location.hash.substring(1);
      if (!hash || !hash.includes('access_token')) return;
      const params = new URLSearchParams(hash);
      const access_token = params.get('access_token');
      const refresh_token = params.get('refresh_token');
      const next = params.get('next');
      if (!access_token) return;
      // Clean the URL first so a reload can't replay the tokens and the
      // router sees the real route.
      const cleanHash = next ? `#${next.startsWith('/') ? next : '/' + next}` : '';
      history.replaceState(null, '', window.location.pathname + cleanHash);
      // Decode the JWT locally and build an authenticated client that carries
      // the token directly in its Authorization header. This sidesteps
      // setSession() which has been hanging on its internal lock.
      const payload = decodeJwt(access_token);
      if (!payload || !payload.sub) {
        console.error('[EmuWorld] could not decode JWT — handoff aborted');
        return;
      }
      currentUser = {
        id: payload.sub,
        email: payload.email,
        app_metadata: payload.app_metadata || {},
        user_metadata: payload.user_metadata || {},
      };
      sbAuth = makeAuthClient(access_token);
      console.log('[EmuWorld] authenticated as', currentUser.email, '(via JWT, no setSession)');
    }

    async function refreshSession() {
      // currentUser is either already set by consumeTokenHandoff() (JWT-based,
      // no Supabase session) or null (anonymous). If null, try reading a
      // session from the Sign in form flow; otherwise we're done.
      if (!currentUser) {
        try {
          const { data: { user } } = await sb.auth.getUser();
          if (user) {
            currentUser = user;
            // sbAuth not created via signIn path — skip, will fall back to anon
          }
        } catch (_) {}
      }
      if (currentUser) {
        const client = sbAuth || sb;
        const { data } = await client.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
        currentProfile = data || { id: currentUser.id, username: null, avatar_url: null, public_profile: false };
      } else {
        currentProfile = null;
      }
      renderNav();
    }

    function renderNav() {
      const loginBtn = document.getElementById('nav-login-btn');
      const meBtn = document.getElementById('nav-me-btn');
      if (currentUser) {
        loginBtn.style.display = 'none';
        meBtn.style.display = '';
        document.getElementById('nav-me-name').textContent = currentProfile?.username || currentUser.email.split('@')[0];
        const avatarEl = document.getElementById('nav-me-avatar');
        if (currentProfile?.avatar_url) {
          avatarEl.outerHTML = `<img id="nav-me-avatar" class="nav__me-fallback" src="${esc(currentProfile.avatar_url)}" alt="avatar" />`;
        } else {
          avatarEl.textContent = initials(currentProfile?.username || currentUser.email);
        }
      } else {
        loginBtn.style.display = '';
        meBtn.style.display = 'none';
      }
    }

    // ============================================================
    // Routing — hash-based so alwaysdata static hosting works.
    //   #/              → home (my profile if connected, else leaderboard)
    //   #/u/<username>  → public profile page
    //   #/leaderboard   → top players
    // ============================================================
    function parseRoute() {
      const h = window.location.hash.replace(/^#\/?/, '');
      if (!h) return { name: 'home' };
      if (h.startsWith('u/')) return { name: 'profile', username: decodeURIComponent(h.slice(2)) };
      if (h === 'leaderboard') return { name: 'leaderboard' };
      if (h === 'account') return { name: 'account' };
      return { name: 'home' };
    }

    function navigate(path) {
      window.location.hash = path;
    }

    async function render() {
      const route = parseRoute();
      if (route.name === 'profile') return renderProfile(route.username);
      if (route.name === 'leaderboard') return renderLeaderboard();
      if (route.name === 'account') {
        // Special: land on the user's own profile and auto-open the Account
        // modal so "Manage on Web" feels like a deep-link.
        if (currentUser && currentProfile?.username) {
          // Swap the hash *without* re-rendering — we're already rendering now.
          history.replaceState(null, '', window.location.pathname + `#/u/${encodeURIComponent(currentProfile.username)}`);
          await renderProfile(currentProfile.username);
        } else {
          await renderLeaderboard();
        }
        // Open modal after render so the markup exists.
        document.getElementById('account-username').value = currentProfile?.username || '';
        document.getElementById('account-status').textContent = '';
        document.getElementById('account-modal').classList.add('open');
        return;
      }
      return renderHome();
    }

    // ============================================================
    // HOME — redirects signed-in users to their own /u/<pseudo>,
    // otherwise shows the leaderboard.
    // ============================================================
    async function renderHome() {
      if (currentUser && currentProfile?.username) {
        navigate(`/u/${encodeURIComponent(currentProfile.username)}`);
        return;
      }
      renderLeaderboard();
    }

    // ============================================================
    // PROFILE page — pulls all the stats we need for one user.
    // Everything hits policies that allow anon reads when
    // profiles.public_profile = true.
    // ============================================================
    async function renderProfile(username) {
      setView(loading());
      console.log('[EmuWorld] renderProfile(', username, ')');

      // Prefer the authenticated client when available — lets a user view
      // their own profile even if it's set to private.
      const client = sbAuth || sb;

      // 1. Resolve the profile by username (public rows only via RLS,
      //    unless we're the owner using sbAuth).
      const { data: profile, error: pErr } = await client
        .from('profiles')
        .select('id, username, avatar_url, public_profile, updated_at')
        .eq('username', username)
        .maybeSingle();
      console.log('[EmuWorld] profile query →', { profile, pErr });

      if (pErr || !profile) {
        setView(`
          <div class="empty">
            <div class="empty__icon">🔒</div>
            <div class="empty__title">Profile unavailable</div>
            <div class="empty__text">This user either doesn't exist or has a private profile.</div>
          </div>
        `);
        return;
      }

      // 2. Pull all games + emulators for this user (RLS already filters).
      const [gamesRes, emusRes] = await Promise.all([
        client.from('playtime_games').select('*').eq('user_id', profile.id),
        client.from('playtime_emulators').select('*').eq('user_id', profile.id),
      ]);
      const games = gamesRes.data || [];
      const emus = emusRes.data || [];

      // 2b. Pull achievements for this user + rarity stats
      const [achRes, rarityRes] = await Promise.all([
        client.from('user_achievements').select('achievement_id, unlocked_at').eq('user_id', profile.id),
        client.from('achievement_rarity').select('*'),
      ]);
      const userAchievements = achRes.data || [];
      const rarityData = rarityRes.data || [];
      const rarityMap = {};
      for (const r of rarityData) rarityMap[r.achievement_id] = r;
      const userAchMap = {};
      for (const a of userAchievements) userAchMap[a.achievement_id] = a;

      // 3. Derive stats client-side (same shape as the Rust playtime::compute_stats).
      const totalSeconds = games.reduce((a, g) => a + (g.seconds || 0), 0);
      const totalLaunches = games.reduce((a, g) => a + (g.launches || 0), 0);
      const gamesPlayed = games.filter((g) => (g.seconds || 0) > 0 || (g.launches || 0) > 0).length;
      const favoriteCount = games.filter((g) => g.favorite).length;

      const byConsole = {};
      for (const g of games) byConsole[g.console] = (byConsole[g.console] || 0) + (g.seconds || 0);
      const topConsole = Object.entries(byConsole).sort((a, b) => b[1] - a[1])[0];

      const topGames = [...games].filter((g) => g.seconds > 0).sort((a, b) => b.seconds - a.seconds).slice(0, 5);
      const mostPlayed = topGames[0];
      const favorite = [...games].filter((g) => g.favorite).sort((a, b) => b.seconds - a.seconds)[0];
      const topEmu = [...emus].sort((a, b) => b.seconds - a.seconds)[0];

      const firstPlayed = games.map((g) => g.first_played).filter(Boolean).sort()[0];

      // Streak: distinct play days ending today.
      const days = new Set(games.map((g) => g.last_played).filter(Boolean).map((d) => d.slice(0, 10)));
      let streak = 0;
      let day = new Date();
      while (days.has(day.toISOString().slice(0, 10))) {
        streak++;
        day.setDate(day.getDate() - 1);
      }

      // 4. Render.
      const avatar = profile.avatar_url
        ? `<img src="${esc(profile.avatar_url)}" alt="avatar" class="profile-hero__avatar" />`
        : `<div class="profile-hero__avatar">${esc(initials(profile.username))}</div>`;

      const rows = [];
      if (mostPlayed) rows.push({
        label: '🏆 Most played',
        name: cleanGameName(mostPlayed.name),
        meta: `${mostPlayed.console} · ${fmtTime(mostPlayed.seconds)}`,
        cover: coverUrlFor(mostPlayed.console, mostPlayed.name),
      });
      if (favorite) rows.push({
        label: '★ Favorite',
        name: cleanGameName(favorite.name),
        meta: `${favorite.console}${favorite.seconds > 0 ? ' · ' + fmtTime(favorite.seconds) : ''}`,
        cover: coverUrlFor(favorite.console, favorite.name),
      });
      if (topEmu) rows.push({ label: '🕹 Top emulator', name: topEmu.emulator_id, meta: fmtTime(topEmu.seconds) });
      if (topConsole) rows.push({ label: '🎮 Top console', name: topConsole[0], meta: fmtTime(topConsole[1]) });
      if (firstPlayed) rows.push({ label: '📅 First played', name: fmtDate(firstPlayed), meta: '' });

      const rowsHtml = rows.map((r) => `
        <div class="row">
          <div class="row__label">${r.label}</div>
          <div class="row__value row__value--with-cover">
            ${r.cover ? `<img class="row__cover" src="${esc(r.cover)}" alt="" loading="lazy" onerror="this.style.display='none'" />` : ''}
            <div class="row__text">
              <span class="row__name">${esc(r.name)}</span>
              ${r.meta ? `<span class="row__meta">${esc(r.meta)}</span>` : ''}
            </div>
          </div>
        </div>
      `).join('');

      const topGamesHtml = topGames.length > 1 ? `
        <div class="section">
          <h3 class="section__title">Top games</h3>
          <ol class="top-list">
            ${topGames.map((g, i) => `
              <li>
                <span class="top-list__rank">${i + 1}</span>
                <span class="top-list__name">${esc(cleanGameName(g.name))} <span class="top-list__meta">· ${esc(g.console)}</span></span>
                <span class="top-list__time">${fmtTime(g.seconds)}</span>
              </li>
            `).join('')}
          </ol>
        </div>
      ` : '';

      // Build achievements section
      const achCount = userAchievements.length;
      const achTotal = ACHIEVEMENTS.length;
      const rankInfo = getRankInfo(achCount);

      const achCardsHtml = ACHIEVEMENTS.map((def) => {
        const unlocked = userAchMap[def.id];
        const rarity = rarityMap[def.id];
        const rarityPct = rarity ? `${rarity.unlock_percent}%` : '—';
        const rarityCount = rarity ? rarity.unlock_count : 0;

        if (def.hidden && !unlocked) {
          return `
            <div class="ach-card ach-card--hidden" title="Achievement secret">
              <div class="ach-card__icon">❓</div>
              <div class="ach-card__info">
                <div class="ach-card__name">???</div>
                <div class="ach-card__desc">${esc(def.hint || 'Un mystère à découvrir...')}</div>
              </div>
            </div>
          `;
        }

        const stateClass = unlocked ? 'ach-card--unlocked' : 'ach-card--locked';
        return `
          <div class="ach-card ${stateClass}">
            <div class="ach-card__icon">${def.icon}</div>
            <div class="ach-card__info">
              <div class="ach-card__name">${esc(def.name)}</div>
              <div class="ach-card__desc">${esc(def.description)}</div>
              ${unlocked ? `<div class="ach-card__date">Débloqué le ${fmtDate(unlocked.unlocked_at)}</div>` : ''}
            </div>
            <div class="ach-card__rarity">
              <div>${rarityPct}</div>
              <div style="font-size:10px;color:var(--muted)">${rarityCount} joueur${rarityCount > 1 ? 's' : ''}</div>
            </div>
          </div>
        `;
      }).join('');

      // Build games grid (for Games tab)
      const allGamesForGrid = [...games].filter(g => g.seconds > 0 || g.launches > 0).sort((a, b) => b.seconds - a.seconds);
      const gamesGridHtml = allGamesForGrid.map(g => {
        const candidates = coverUrlCandidates(g.console, g.name);
        const cleaned = cleanGameName(g.name);
        let coverHtml;
        if (candidates.length > 0) {
          const fallbacksJson = JSON.stringify(candidates.slice(1)).replace(/"/g, '&quot;');
          coverHtml = `<img class="game-tile__cover" src="${esc(candidates[0])}" alt="" loading="lazy" data-fallbacks="${fallbacksJson}" onerror="handleCoverError(this)" />`;
        } else {
          coverHtml = `<div class="game-tile__placeholder">🎮</div>`;
        }
        return `
          <div class="game-tile" data-game-key="${esc(g.console + '::' + g.name)}">
            ${coverHtml}
            <div class="game-tile__info">
              <div class="game-tile__name" title="${esc(cleaned)}">${esc(cleaned)}</div>
              <div class="game-tile__meta">${esc(g.console)} · ${fmtTime(g.seconds)}</div>
            </div>
          </div>
        `;
      }).join('');

      setView(`
        <header class="profile-hero">
          ${avatar}
          <div>
            <h1 class="profile-hero__name">
              ${esc(profile.username)}
              <span class="profile-hero__badge">${rankInfo.icon} ${rankInfo.rank}</span>
            </h1>
            <div class="profile-hero__meta">
              ${gamesPlayed} game${gamesPlayed === 1 ? '' : 's'} · ${fmtTime(totalSeconds)} total
              ${streak > 0 ? ` · 🔥 ${streak} day streak` : ''}
              · ${achCount}/${achTotal} achievements
            </div>
            <div class="profile-hero__url">Share: <code>emuworld.alwaysdata.net/#/u/${esc(profile.username)}</code></div>
          </div>
        </header>

        <div class="profile-tabs" id="profile-tabs">
          <button class="profile-tabs__btn profile-tabs__btn--active" data-tab="overview">Overview</button>
          <button class="profile-tabs__btn" data-tab="games">Games (${allGamesForGrid.length})</button>
          <button class="profile-tabs__btn" data-tab="achievements">Achievements (${achCount}/${achTotal})</button>
        </div>

        <div id="tab-overview">
          <section class="tiles">
            <div class="tile"><div class="tile__v">${fmtTime(totalSeconds)}</div><div class="tile__l">Total playtime</div></div>
            <div class="tile"><div class="tile__v">${gamesPlayed}</div><div class="tile__l">Games played</div></div>
            <div class="tile"><div class="tile__v">${totalLaunches}</div><div class="tile__l">Launches</div></div>
            <div class="tile"><div class="tile__v">★ ${favoriteCount}</div><div class="tile__l">Favorites</div></div>
          </section>

          ${rows.length ? `<section class="section"><h3 class="section__title">Highlights</h3>${rowsHtml}</section>` : ''}

          ${topGamesHtml}
        </div>

        <div id="tab-games" style="display:none">
          ${allGamesForGrid.length > 0 ? `<div class="games-grid">${gamesGridHtml}</div>` : `
            <div class="empty">
              <div class="empty__icon">🎮</div>
              <div class="empty__title">No games yet</div>
            </div>
          `}
        </div>

        <div id="tab-achievements" style="display:none">
          <section class="section achievements-section">
            <div class="achievements-header">
              <h3 class="section__title" style="margin:0">Achievements</h3>
              <div class="achievements-rank">
                <span class="achievements-rank__icon">${rankInfo.icon}</span>
                <span class="achievements-rank__label">${rankInfo.rank}</span>
                <span class="achievements-rank__count">${achCount}/${achTotal}</span>
              </div>
            </div>
            <div class="achievements-grid">
              ${achCardsHtml}
            </div>
          </section>
        </div>

        <div class="modal-overlay" id="game-detail-modal">
          <div class="game-detail" style="position:relative">
            <button class="game-detail__close" id="game-detail-close">&times;</button>
            <div id="game-detail-content"></div>
          </div>
        </div>

        ${games.length === 0 ? `
          <div class="empty">
            <div class="empty__icon">🎮</div>
            <div class="empty__title">No sessions yet</div>
            <div class="empty__text">This player hasn't launched a tracked game yet.</div>
          </div>
        ` : ''}
      `);

      // Tab switching
      const tabs = document.querySelectorAll('#profile-tabs .profile-tabs__btn');
      tabs.forEach(btn => {
        btn.addEventListener('click', () => {
          tabs.forEach(b => b.classList.remove('profile-tabs__btn--active'));
          btn.classList.add('profile-tabs__btn--active');
          const tab = btn.getAttribute('data-tab');
          document.getElementById('tab-overview').style.display = tab === 'overview' ? '' : 'none';
          document.getElementById('tab-games').style.display = tab === 'games' ? '' : 'none';
          document.getElementById('tab-achievements').style.display = tab === 'achievements' ? '' : 'none';
        });
      });

      // Game tile click → detail modal
      const gameDetailModal = document.getElementById('game-detail-modal');
      const gameDetailContent = document.getElementById('game-detail-content');
      document.getElementById('game-detail-close')?.addEventListener('click', () => gameDetailModal.classList.remove('open'));
      gameDetailModal?.addEventListener('click', (e) => { if (e.target === gameDetailModal) gameDetailModal.classList.remove('open'); });

      document.querySelectorAll('.game-tile').forEach(tile => {
        tile.addEventListener('click', async () => {
          const key = tile.getAttribute('data-game-key');
          const g = games.find(x => (x.console + '::' + x.name) === key);
          if (!g) return;
          const cover = coverUrlFor(g.console, g.name);
          const cleaned = cleanGameName(g.name);

          // Show modal with loading state
          gameDetailContent.innerHTML = `
            <div class="game-detail__header">
              ${cover ? `<img class="game-detail__cover" src="${esc(cover)}" alt="" onerror="this.style.display='none'" />` : ''}
              <div>
                <h2 class="game-detail__title">${esc(cleaned)}</h2>
                <div class="game-detail__meta">${esc(g.console)}</div>
              </div>
            </div>
            <div class="game-detail__stats">
              <div>Playtime: <span>${fmtTime(g.seconds)}</span></div>
              <div>Launches: <span>${g.launches}</span></div>
              ${g.favorite ? '<div>★ Favorite</div>' : ''}
            </div>
            <div class="game-detail__stats">
              ${g.first_played ? `<div>First played: <span>${fmtDate(g.first_played)}</span></div>` : ''}
              ${g.last_played ? `<div>Last played: <span>${fmtDate(g.last_played)}</span></div>` : ''}
            </div>
            <div id="ra-section" style="margin-top:16px;color:var(--muted);font-size:13px;">
              ${RA_CONSOLE_IDS[g.console] ? '<div class="loading__spinner" style="width:24px;height:24px;margin:8px 0;"></div> Loading RetroAchievements...' : ''}
            </div>
          `;
          gameDetailModal.classList.add('open');

          // Fetch RA data if console is supported
          if (RA_CONSOLE_IDS[g.console]) {
            const raData = await fetchRaGameProgress(g.name, g.console);
            const raSection = document.getElementById('ra-section');
            if (!raSection) return;

            if (!raData || !raData.Achievements) {
              const creds = getRaCredentials();
              if (!creds || !creds.username) {
                raSection.innerHTML = `
                  <div style="padding:12px;background:var(--bg-2);border:1px solid var(--border);border-radius:10px;">
                    <div style="font-weight:700;margin-bottom:8px;">🏆 RetroAchievements</div>
                    <p style="font-size:12px;margin:0 0 8px;">Entrez vos identifiants RA pour voir la progression.</p>
                    <input id="ra-user-input" class="modal__input" placeholder="Username" style="margin-bottom:6px;padding:8px 10px;font-size:12px;" />
                    <input id="ra-key-input" class="modal__input" placeholder="API Key" style="margin-bottom:8px;padding:8px 10px;font-size:12px;" />
                    <button class="btn btn--primary" style="padding:6px 12px;font-size:12px;" onclick="saveRaCredentials(document.getElementById('ra-user-input').value, document.getElementById('ra-key-input').value); this.textContent='Saved!'; this.disabled=true;">Sauvegarder</button>
                  </div>
                `;
              } else {
                raSection.innerHTML = `<div style="color:var(--muted);font-size:12px;">Jeu non trouvé sur RetroAchievements.</div>`;
              }
              return;
            }

            const achievements = Object.values(raData.Achievements || {});
            const numEarned = achievements.filter(a => a.DateEarned).length;
            const numTotal = achievements.length;
            const pctEarned = numTotal > 0 ? Math.round((numEarned / numTotal) * 100) : 0;
            const totalPts = achievements.reduce((s, a) => s + (parseInt(a.Points) || 0), 0);
            const earnedPts = achievements.filter(a => a.DateEarned).reduce((s, a) => s + (parseInt(a.Points) || 0), 0);
            const is100 = numEarned === numTotal && numTotal > 0;

            const achListHtml = achievements
              .sort((a, b) => (a.DisplayOrder || a.ID) - (b.DisplayOrder || b.ID))
              .map(a => {
                const unlocked = !!a.DateEarned;
                return `
                  <div class="game-detail__ach ${unlocked ? 'game-detail__ach--unlocked' : ''}">
                    <img class="game-detail__ach-badge ${!unlocked ? 'game-detail__ach-badge--locked' : ''}" src="https://retroachievements.org/Badge/${a.BadgeName}.png" alt="" />
                    <div style="flex:1;min-width:0;">
                      <div class="game-detail__ach-name">${esc(a.Title)}</div>
                      <div class="game-detail__ach-desc">${esc(a.Description)}</div>
                      ${unlocked ? `<div class="game-detail__ach-date">${a.DateEarnedHardcore ? '🏆' : '✓'} ${a.DateEarned}</div>` : ''}
                    </div>
                    <div class="game-detail__ach-pts">${a.Points} pts</div>
                  </div>
                `;
              }).join('');

            raSection.innerHTML = `
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
                <div style="font-weight:700;font-size:14px;">🏆 RetroAchievements ${is100 ? '<span style="background:rgba(34,197,94,0.2);color:#22c55e;padding:2px 8px;border-radius:6px;font-size:11px;margin-left:8px;">100%</span>' : ''}</div>
                <div style="font-size:12px;color:var(--amber);font-weight:600;">${earnedPts} / ${totalPts} pts</div>
              </div>
              <div class="game-detail__progress">
                <div class="game-detail__progress-fill" style="width:${pctEarned}%"></div>
              </div>
              <div style="font-size:12px;color:var(--muted);margin-bottom:12px;">${numEarned} / ${numTotal} débloqués</div>
              <div class="game-detail__ach-list">${achListHtml}</div>
            `;
          }
        });
      });
    }

    // ============================================================
    // LEADERBOARD — reads playtime_leaderboard (public view defined in the
    // Supabase migration). Sorted by total seconds descending.
    // ============================================================
    async function renderLeaderboard() {
      setView(loading());
      const { data, error } = await sb
        .from('playtime_leaderboard')
        .select('*')
        .order('total_seconds', { ascending: false })
        .limit(50);

      if (error) {
        setView(`<div class="empty"><div class="empty__icon">⚠️</div><div class="empty__title">Could not load the leaderboard</div><div class="empty__text">${esc(error.message)}</div></div>`);
        return;
      }

      if (!data || data.length === 0) {
        setView(`
          <div class="empty">
            <div class="empty__icon">🏆</div>
            <div class="empty__title">No players yet</div>
            <div class="empty__text">Flip your profile to public in the desktop app to show up here.</div>
          </div>
        `);
        return;
      }

      const rows = data.map((u, i) => {
        const rank = i + 1;
        const rankClass = rank <= 3 ? `lb__rank--${rank}` : '';
        const avatar = u.avatar_url
          ? `<img class="lb__avatar" src="${esc(u.avatar_url)}" alt="" />`
          : `<span class="lb__avatar" style="display:inline-flex;align-items:center;justify-content:center;font-weight:600;color:var(--purple);">${esc(initials(u.username))}</span>`;
        return `
          <div class="lb__row" data-username="${esc(u.username)}">
            <span class="lb__rank ${rankClass}">${rank}</span>
            <div class="lb__user">
              ${avatar}
              <span class="lb__uname">${esc(u.username || '—')}</span>
            </div>
            <span class="lb__num">${fmtTime(u.total_seconds)}</span>
            <span class="lb__num lb__num--muted">${u.games_played} game${u.games_played === 1 ? '' : 's'}</span>
          </div>
        `;
      }).join('');

      setView(`
        <h1 style="margin:0 0 6px;font-size:28px;">Leaderboard</h1>
        <p style="color:var(--muted);margin:0 0 22px;font-size:14px;">Top ${data.length} player${data.length === 1 ? '' : 's'} by total playtime. Click a row to open their profile.</p>
        <div class="lb">
          <div class="lb__row lb__row--head">
            <span>#</span>
            <span>Player</span>
            <span>Playtime</span>
            <span>Games</span>
          </div>
          ${rows}
        </div>
      `);

      // Wire clicks after render
      view.querySelectorAll('.lb__row[data-username]').forEach((r) => {
        r.addEventListener('click', () => {
          const u = r.getAttribute('data-username');
          if (u) navigate(`/u/${encodeURIComponent(u)}`);
        });
      });
    }

    // ============================================================
    // Nav wiring
    // ============================================================
    document.querySelectorAll('[data-route]').forEach((el) => {
      el.addEventListener('click', () => {
        const r = el.getAttribute('data-route');
        if (r === 'home') navigate('/');
        if (r === 'leaderboard') navigate('/leaderboard');
      });
    });

    // Me button → account modal
    const accountModal = document.getElementById('account-modal');
    const loginModal = document.getElementById('login-modal');
    document.getElementById('nav-me-btn')?.addEventListener('click', () => {
      document.getElementById('account-username').value = currentProfile?.username || '';
      document.getElementById('account-status').textContent = '';
      accountModal.classList.add('open');
    });
    document.getElementById('account-close').addEventListener('click', () => accountModal.classList.remove('open'));
    document.getElementById('account-logout').addEventListener('click', async () => {
      try { await sb.auth.signOut(); } catch (_) {}
      // JWT-only session: clear manually as signOut() doesn't know about it.
      currentUser = null;
      currentProfile = null;
      sbAuth = null;
      accountModal.classList.remove('open');
      renderNav();
      navigate('/');
      render();
    });
    document.getElementById('account-save').addEventListener('click', async () => {
      const status = document.getElementById('account-status');
      const newName = document.getElementById('account-username').value.trim();
      if (!newName) { status.className = 'status err'; status.textContent = 'Username cannot be empty.'; return; }
      if (!sbAuth) { status.className = 'status err'; status.textContent = 'Not authenticated.'; return; }
      const { error } = await sbAuth.from('profiles')
        .upsert({ id: currentUser.id, username: newName, updated_at: new Date().toISOString() }, { onConflict: 'id' });
      if (error) { status.className = 'status err'; status.textContent = error.message; return; }
      status.className = 'status ok'; status.textContent = 'Saved ✅';
      await refreshSession();
    });

    // Sign in modal
    document.getElementById('nav-login-btn').addEventListener('click', () => {
      document.getElementById('login-status').textContent = '';
      loginModal.classList.add('open');
    });
    document.getElementById('login-close').addEventListener('click', () => loginModal.classList.remove('open'));
    document.getElementById('login-submit').addEventListener('click', async () => {
      const status = document.getElementById('login-status');
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      status.className = 'status'; status.textContent = 'Signing in…';
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) { status.className = 'status err'; status.textContent = error.message; return; }
      if (data?.session?.access_token) {
        sbAuth = makeAuthClient(data.session.access_token);
        currentUser = data.user;
      }
      loginModal.classList.remove('open');
      await refreshSession();
      render();
    });

    // ============================================================
    // Boot
    // ============================================================
    window.addEventListener('hashchange', render);

    (async () => {
      console.log('[EmuWorld] boot — URL:', window.location.href);
      try {
        await consumeTokenHandoff();
        console.log('[EmuWorld] handoff done — URL is now:', window.location.href);
      } catch (e) {
        console.error('[EmuWorld] handoff failed:', e);
      }
      try {
        await refreshSession();
        console.log('[EmuWorld] refreshSession done — user:', currentUser?.email || 'none', 'profile:', currentProfile);
      } catch (e) {
        console.error('[EmuWorld] refreshSession failed:', e);
      }
      try {
        console.log('[EmuWorld] parseRoute →', parseRoute());
        await render();
        console.log('[EmuWorld] render done');
      } catch (e) {
        console.error('[EmuWorld] render failed:', e);
        setView(`<div class="empty"><div class="empty__icon">⚠️</div><div class="empty__title">Something went wrong</div><div class="empty__text">${esc(e && e.message ? e.message : String(e))}</div></div>`);
      }
    })();
  </script>
</body>
</html>
