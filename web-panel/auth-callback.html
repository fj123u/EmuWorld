<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>EmuWorld · OAuth callback</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #1e1f22;
    --card: #2b2d31;
    --blurple: #5865F2;
    --text: #F2F3F5;
    --muted: #9A9CA0;
    --border: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', -apple-system, Segoe UI, sans-serif;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: linear-gradient(180deg, #383a40, var(--card));
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 36px 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.05);
    text-align: center;
  }
  .logo {
    width: 72px; height: 72px;
    margin: 0 auto 20px;
    border-radius: 22px;
    background: linear-gradient(135deg, #7b86f5, var(--blurple));
    display: grid; place-items: center;
    font-size: 32px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.2), 0 6px 18px rgba(88,101,242,0.35);
  }
  h1 { font-size: 22px; font-weight: 900; margin-bottom: 8px; }
  p { color: var(--muted); font-size: 14px; line-height: 1.5; }
  .status {
    margin-top: 22px;
    padding: 12px 16px;
    background: rgba(88,101,242,0.15);
    border: 1px solid rgba(88,101,242,0.35);
    border-radius: 14px;
    font-size: 13px;
    font-weight: 700;
    color: #a3acff;
  }
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.15);
    border-top-color: #a3acff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -2px;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
    padding: 10px 18px;
    background: var(--blurple);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    color: white;
    font-family: inherit;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 3px 0 #2e3680, 0 6px 14px rgba(88,101,242,0.28);
  }
  .btn:hover { transform: translateY(-1px); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🎮</div>
    <h1>Connexion EmuWorld</h1>
    <p>On transmet ton identification à l'application, tu peux fermer cette fenêtre.</p>
    <div class="status" id="status">
      <span class="spinner"></span>Ouverture d'EmuWorld…
    </div>
    <button class="btn" id="retry" style="display:none" onclick="jump()">↻ Réessayer</button>
  </div>

<script>
  // Forward whatever Supabase put in the URL (hash or query) to the desktop
  // app via the custom scheme. Supabase may use either #access_token=...
  // (implicit) or ?code=... (PKCE) — we preserve both paths.
  function buildDeepLink() {
    const hash = window.location.hash;
    const search = window.location.search;
    // Prefer the hash fragment when present (Supabase default for OAuth).
    if (hash && hash.length > 1) {
      return 'emuworld://auth-callback' + hash;
    }
    if (search && search.length > 1) {
      return 'emuworld://auth-callback' + search;
    }
    return 'emuworld://auth-callback';
  }

  function jump() {
    const url = buildDeepLink();
    // Try to trigger the custom-scheme handler. Most browsers will prompt the
    // user the first time ("Allow emuworld:// to open this link?") and the
    // app picks it up from there.
    window.location.replace(url);
    // Show a fallback button + close attempt after a short delay in case the
    // browser blocked the scheme or the user dismissed the prompt.
    setTimeout(() => {
      document.getElementById('status').innerHTML =
        '✅ EmuWorld devrait s\'être ouverte. Si ce n\'est pas le cas, clique ci-dessous.';
      document.getElementById('retry').style.display = 'inline-flex';
      // window.close() is a best-effort — only works when the tab was opened
      // by a script (some browsers block it otherwise). Non-fatal.
      window.close();
    }, 1500);
  }

  jump();
</script>
</body>
</html>
