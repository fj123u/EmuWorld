<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg">
      <stop offset="0" stop-color="#313338"/>
      <stop offset="1" stop-color="#1e1f22"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- circular dark background so it reads as a small-icon badge -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  <!-- centred gamepad glyph -->
  <g transform="translate(256 256) scale(1.4)" filter="url(#shadow)">
    <!-- body -->
    <path d="
      M -140,-38
      Q -160,-62 -130,-72
      L 130,-72
      Q 160,-62 140,-38
      L 128,28
      Q 120,76 74,76
      L 30,76
      Q 20,76 12,64
      L -12,64
      Q -20,76 -30,76
      L -74,76
      Q -120,76 -128,28
      Z
    " fill="#5865F2" stroke="#3a46d0" stroke-width="3"/>
    <!-- D-pad -->
    <g transform="translate(-80 10)">
      <rect x="-20" y="-6" width="40" height="12" rx="2" fill="rgba(255,255,255,0.9)"/>
      <rect x="-6" y="-20" width="12" height="40" rx="2" fill="rgba(255,255,255,0.9)"/>
    </g>
    <!-- ABXY -->
    <g transform="translate(80 10)" fill="rgba(255,255,255,0.9)">
      <circle cx="0" cy="-20" r="7"/>
      <circle cx="0" cy="20" r="7"/>
      <circle cx="-20" cy="0" r="7"/>
      <circle cx="20" cy="0" r="7"/>
    </g>
    <!-- start/select -->
    <rect x="-18" y="-4" width="12" height="4" rx="2" fill="rgba(255,255,255,0.5)"/>
    <rect x="6" y="-4" width="12" height="4" rx="2" fill="rgba(255,255,255,0.5)"/>
  </g>
</svg>
