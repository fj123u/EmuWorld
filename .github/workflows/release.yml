name: Release

# Triggered when we push a tag like `v0.1.0-alpha.1`. Builds the Windows
# installer, signs it with the Tauri updater keypair, uploads artefacts
# to a draft GitHub Release, and generates the `latest.json` the in-app
# updater polls.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # needed to create the Release and upload assets

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install frontend deps
        run: npm ci

      - name: Sanity-check signing key is present
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Repo secret TAURI_SIGNING_PRIVATE_KEY is empty or missing — updates won't sign"
            exit 1
          fi
          echo "Signing key present: OK"

      - name: Build + bundle + sign
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npx @tauri-apps/cli build --verbose

      - name: Locate artefacts + build latest.json
        id: artefacts
        shell: bash
        run: |
          set -e
          BUNDLE_DIR="src-tauri/target/release/bundle"
          echo "::group::Full bundle tree"
          ls -R "$BUNDLE_DIR" || echo "bundle dir missing"
          echo "::endgroup::"

          # Match any .exe under bundle/nsis and its .sig counterpart. The
          # exact file name depends on Tauri's bundle config (productName
          # + version + target triple) so we don't pin the prefix.
          NSIS_EXE=$(find "$BUNDLE_DIR/nsis" -maxdepth 1 -type f -name "*.exe" ! -name "*.sig" | head -n1 || true)
          NSIS_SIG=$(find "$BUNDLE_DIR/nsis" -maxdepth 1 -type f -name "*.exe.sig" | head -n1 || true)

          MSI=$(find "$BUNDLE_DIR/msi" -maxdepth 1 -type f -name "*.msi" ! -name "*.sig" 2>/dev/null | head -n1 || true)
          MSI_SIG=$(find "$BUNDLE_DIR/msi" -maxdepth 1 -type f -name "*.msi.sig" 2>/dev/null | head -n1 || true)

          echo "resolved nsis_exe=$NSIS_EXE"
          echo "resolved nsis_sig=$NSIS_SIG"
          echo "resolved msi=$MSI"
          echo "resolved msi_sig=$MSI_SIG"

          if [ -z "$NSIS_EXE" ] || [ -z "$NSIS_SIG" ]; then
            echo "::error::Could not locate NSIS installer or its signature"
            exit 1
          fi

          # Build latest.json right here so we still have clean paths in
          # shell vars — passing them through GITHUB_OUTPUT to another
          # step was eating the values on Windows runners.
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SIG=$(cat "$NSIS_SIG")
          SETUP_FILE=$(basename "$NSIS_EXE")
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${SETUP_FILE}"

          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "See the release page on GitHub for details.",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIG}",
                "url": "${DOWNLOAD_URL}"
              }
            }
          }
          EOF

          echo "::group::latest.json"
          cat latest.json
          echo "::endgroup::"

          echo "nsis_exe=$NSIS_EXE" >> $GITHUB_OUTPUT
          echo "nsis_sig=$NSIS_SIG" >> $GITHUB_OUTPUT
          echo "msi=$MSI" >> $GITHUB_OUTPUT
          echo "msi_sig=$MSI_SIG" >> $GITHUB_OUTPUT

      - name: Create release + upload artefacts
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          # softprops ignores blank lines, so empty MSI outputs won't break.
          files: |
            ${{ steps.artefacts.outputs.nsis_exe }}
            ${{ steps.artefacts.outputs.nsis_sig }}
            ${{ steps.artefacts.outputs.msi }}
            ${{ steps.artefacts.outputs.msi_sig }}
            latest.json
          generate_release_notes: true
