name: CI

# Runs on every push (main is pushed to directly) and on pull requests, so a
# change that breaks an existing feature is flagged within minutes.
on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"] # release.yml runs the same checks before building
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Type-check + build frontend
        run: npm run build

      - name: Frontend tests (UI pages, store flows, translations)
        run: npm test

      - name: Rust tests (scan, downloads, playtime, catalog)
        run: cargo test --manifest-path src-tauri/Cargo.toml
