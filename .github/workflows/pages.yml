name: Web panel (GitHub Pages)

# Publishes web-panel/ (public profiles, leaderboard, account, email
# confirmation page) to https://fj123u.github.io/EmuWorld/.
# Needs Settings → Pages → Source: "GitHub Actions" (once).
on:
  push:
    branches: [main]
    paths: ["web-panel/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-panel
      - id: deployment
        uses: actions/deploy-pages@v4
